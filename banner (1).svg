<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2937"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="380" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="none" stroke="#1f2937"/>

  <!-- Left side -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="64" y="70" width="190" height="30" rx="15" fill="#0f172a" stroke="#1e3a5f"/>
    <circle cx="84" cy="85" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="98" y="90" font-size="14" fill="#94a3b8">Available for work</text>

    <text x="64" y="160" font-size="54" font-weight="700" fill="#f8fafc" letter-spacing="1">Syed Ijlal Haider</text>
    <rect x="66" y="180" width="90" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="224" font-size="24" fill="#cbd5e1">Full Stack Web and Mobile App Developer</text>

    <g font-size="15" fill="#94a3b8">
      <rect x="64" y="258" width="92" height="32" rx="8" fill="#111c2e" stroke="#1e293b"/>
      <text x="110" y="279" text-anchor="middle">Next.js</text>
      <rect x="166" y="258" width="84" height="32" rx="8" fill="#111c2e" stroke="#1e293b"/>
      <text x="208" y="279" text-anchor="middle">React</text>
      <rect x="260" y="258" width="88" height="32" rx="8" fill="#111c2e" stroke="#1e293b"/>
      <text x="304" y="279" text-anchor="middle">Flutter</text>
      <rect x="358" y="258" width="128" height="32" rx="8" fill="#111c2e" stroke="#1e293b"/>
      <text x="422" y="279" text-anchor="middle">React Native</text>
      <rect x="496" y="258" width="110" height="32" rx="8" fill="#111c2e" stroke="#1e293b"/>
      <text x="551" y="279" text-anchor="middle">TypeScript</text>
    </g>

    <text x="64" y="330" font-size="14" fill="#64748b">github.com/codewithijlal</text>
  </g>

  <!-- Code window -->
  <g transform="translate(720 62)">
    <rect width="420" height="256" rx="12" fill="#0d1321" stroke="#24304a"/>
    <path d="M0 12a12 12 0 0 1 12-12h396a12 12 0 0 1 12 12v24H0z" fill="#131b2e"/>
    <circle cx="20" cy="18" r="5.5" fill="#f87171"/>
    <circle cx="38" cy="18" r="5.5" fill="#fbbf24"/>
    <circle cx="56" cy="18" r="5.5" fill="#34d399"/>
    <text x="210" y="23" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#64748b">developer.ts</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="14.5" xml:space="preserve">
      <text x="22" y="70"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> ijlal </tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#e2e8f0"> {</tspan></text>
      <text x="44" y="96"><tspan fill="#7dd3fc">role</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"Full Stack Developer"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="44" y="122"><tspan fill="#7dd3fc">web</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"Next.js"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"React"</tspan><tspan fill="#94a3b8">],</tspan></text>
      <text x="44" y="148"><tspan fill="#7dd3fc">mobile</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"Flutter"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"React Native"</tspan><tspan fill="#94a3b8">],</tspan></text>
      <text x="44" y="174"><tspan fill="#7dd3fc">data</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"Postgres"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"MongoDB"</tspan><tspan fill="#94a3b8">],</tspan></text>
      <text x="44" y="200"><tspan fill="#7dd3fc">shipping</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fbbf24">true</tspan></text>
      <text x="22" y="226"><tspan fill="#e2e8f0">};</tspan><tspan fill="#38bdf8">▍<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>
</svg>
